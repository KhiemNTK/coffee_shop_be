name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: coffee_shop
          POSTGRES_PASSWORD: coffee_shop
          POSTGRES_DB: coffee_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee_shop -d coffee_shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://coffee_shop:coffee_shop@localhost:5432/coffee_shop_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret-with-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-thirty-two-characters
      PASSWORD_RESET_URL: http://localhost:3001/reset-password
      FE_URL: http://localhost:3001
      CSRF_ENABLED: 'true'
      COOKIE_SECURE: 'false'
      MAIL_HOST: localhost
      MAIL_PORT: '1025'
      MAIL_USER: ci
      MAIL_PASS: ci
      MAIL_FROM: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec jest --runInBand
      - run: pnpm exec jest --config ./test/jest-e2e.json --runInBand
