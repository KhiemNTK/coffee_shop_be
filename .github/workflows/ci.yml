name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: coffee_shop
          POSTGRES_PASSWORD: coffee_shop
          POSTGRES_DB: coffee_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee_shop -d coffee_shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://coffee_shop:coffee_shop@localhost:5432/coffee_shop_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret-with-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-thirty-two-characters
      PASSWORD_RESET_URL: http://localhost:3001/reset-password
      FE_URL: http://localhost:3001
      CSRF_ENABLED: 'true'
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm prisma:preflight
      - name: Check deployed schema for drift
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm verify
      - run: pnpm exec jest --config ./test/jest-e2e.json --runInBand --detectOpenHandles

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag coffee-shop-api:ci .
      - name: Verify runtime is non-root
        run: test "$(docker run --rm --entrypoint id coffee-shop-api:ci -u)" = 1000
      - name: Verify generated Prisma Client is in the runtime image
        run: docker run --rm --entrypoint node coffee-shop-api:ci -e "if (typeof require('@prisma/client').PrismaClient !== 'function') process.exit(1)"
