groups:
  - name: coffee-shop-ai-insights
    rules:
      - alert: CoffeeShopAiQueueUnavailable
        expr: coffee_shop_ai_insight_enabled == 1 and coffee_shop_ai_insight_queue_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: AI insight queue cannot be inspected
          description: Check Redis and worker logs; do not blindly resubmit paid analyses.

      - alert: CoffeeShopAiQueueStalled
        expr: coffee_shop_ai_insight_queue_head_age_seconds > 120 and coffee_shop_ai_insight_queue_up == 1 and coffee_shop_ai_insight_enabled == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: AI insight queue head has not finished
          description: Inspect worker health, SQL latency and delayed retries before restarting.

      - alert: CoffeeShopAiJobsFailing
        expr: sum(increase(coffee_shop_ai_insight_jobs_total{outcome="failed"}[1h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: Multiple AI insight jobs failed
          description: Inspect bounded error codes, provider configuration and daily call budget.

      - alert: CoffeeShopAiRetriesStalled
        expr: coffee_shop_ai_insight_queue_jobs{state="delayed"} > 0 and on(instance) coffee_shop_ai_insight_queue_up == 1 and on(instance) coffee_shop_ai_insight_enabled == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: AI insight retries have remained delayed
          description: Normal retry delays are seconds; inspect worker and scheduler recovery.

  - name: coffee-shop-api
    rules:
      - alert: CoffeeShopRedisMemoryPressure
        expr: coffee_shop_redis_memory_used_bytes / coffee_shop_redis_maxmemory_bytes > 0.8 and coffee_shop_redis_maxmemory_bytes > 0 and on(instance) coffee_shop_dependency_up{dependency="redis"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis memory exceeds 80 percent of maxmemory
          description: Inspect queue retention and memory before writes are refused; do not enable key eviction for BullMQ.

      - alert: CoffeeShopRedisMemoryUnbounded
        expr: coffee_shop_redis_maxmemory_bytes == 0 and on(instance) coffee_shop_dependency_up{dependency="redis"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis has no configured memory limit
          description: Configure maxmemory with noeviction and leave container headroom for AOF rewriting and clients.

      - alert: CoffeeShopRateLimiterUnavailable
        expr: increase(coffee_shop_rate_limit_unavailable_total[5m]) >= 3
        labels:
          severity: critical
        annotations:
          summary: Redis-backed rate limiting is refusing requests
          description: Inspect Redis command failures, ACLs, memory and persistence; PING success alone does not prove writes work.

      - alert: CoffeeShopPostgresUnavailable
        expr: coffee_shop_dependency_up{dependency="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL is unavailable or cannot be inspected
          description: Check database connectivity and collector logs, even when API traffic is low.

      - alert: CoffeeShopMetricsCollectionFailing
        expr: sum by (instance, collector) (increase(coffee_shop_metrics_collection_failures_total[5m])) >= 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Operational metric collection is failing
          description: Published gauges may be stale; inspect collector errors before trusting backlog or payment counts.

      - alert: CoffeeShopTurnstileUnavailable
        expr: sum(increase(coffee_shop_turnstile_verifications_total{outcome="unavailable"}[5m])) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Human verification is failing at the provider boundary
          description: Inspect turnstile.unavailable logs and Cloudflare settings; never disable server verification to restore access.

      - alert: CoffeeShopApiTargetDown
        expr: up{job="coffee-shop-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Coffee Shop API target is unavailable
          description: Prometheus has been unable to scrape {{ $labels.instance }} for two minutes.

      - alert: CoffeeShopApiHighErrorRate
        expr: |
          (
            sum(rate(coffee_shop_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(coffee_shop_http_requests_total[5m])), 0.001)
            > 0.01
          )
          and
          sum(increase(coffee_shop_http_requests_total[5m])) >= 100
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Coffee Shop API error rate exceeds 1 percent
          description: The rolling five-minute server error ratio has exceeded the production error budget for ten minutes.

      - alert: CoffeeShopApiReadLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(coffee_shop_http_request_duration_seconds_bucket{method="GET"}[5m])
            )
          ) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Coffee Shop API read p95 exceeds 300 ms
          description: GET request p95 latency has exceeded the initial SLO for ten minutes.

      - alert: CoffeeShopApiMutationLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(coffee_shop_http_request_duration_seconds_bucket{method=~"POST|PUT|PATCH|DELETE"}[5m])
            )
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Coffee Shop API mutation p95 exceeds 500 ms
          description: Mutation request p95 latency has exceeded the initial SLO for ten minutes.

      - alert: CoffeeShopPostgresConnectionPressure
        expr: |
          coffee_shop_postgres_connections
          /
          clamp_min(coffee_shop_postgres_max_connections, 1)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connections exceed 80 percent
          description: PostgreSQL server connection usage is approaching max_connections.

      - alert: CoffeeShopRedisUnavailable
        expr: coffee_shop_dependency_up{dependency="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis is unavailable
          description: Redis-dependent rate limiting and background processing may be degraded.

  - name: coffee-shop-durable-processing
    rules:
      - alert: CoffeeShopOutboxLagHigh
        expr: coffee_shop_outbox_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Durable outbox lag exceeds 60 seconds
          description: The oldest unpublished event has remained queued for more than five minutes.

      - alert: CoffeeShopOutboxDeadLetterPresent
        expr: coffee_shop_outbox_events{status="DEAD_LETTER"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Durable outbox contains dead-letter events
          description: At least one domain event exhausted all delivery attempts and needs operator review.

      - alert: CoffeeShopTransactionRetrySpike
        expr: sum(rate(coffee_shop_transaction_retries_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Database transaction conflicts are elevated
          description: Serializable transaction retries exceed one per second and may indicate contention.

      - alert: CoffeeShopPaymentRequiresReview
        expr: sum(coffee_shop_payment_review_items) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Payment records require manual review
          description: A payment attempt or refund has remained in manual review for ten minutes.

      - alert: CoffeeShopPaymentMismatchIncident
        expr: |
          sum(
            coffee_shop_payment_reconciliation_incidents{
              type=~"PAYMENT_STATE_CONFLICT|PROVIDER_PAYMENT_MISMATCH|REFUND_STATE_MISMATCH"
            }
          ) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Payment reconciliation mismatch detected
          description: Local financial state differs from the payment provider and automatic mutation has stopped.
