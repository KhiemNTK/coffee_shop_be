x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *runtime
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *runtime
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *runtime
    build:
      context: ..
      target: runtime
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      APP_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL:?Use postgres as database hostname}
      REDIS_URL: ${REDIS_URL:?Use redis as Redis hostname}
      FE_URL: https://${APP_DOMAIN:?Set public domain}
      PASSWORD_RESET_URL: https://${APP_DOMAIN:?Set public domain}/reset-password
      COOKIE_SECURE: 'true'
      CSRF_ENABLED: 'true'
      AUTH_SIGNUP_ENABLED: 'false'
      SWAGGER_ENABLED: 'false'
      TRUST_PROXY: uniquelocal
      NODE_OPTIONS: --max-old-space-size=512
    init: true
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    mem_limit: 768m
    stop_grace_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    <<: *runtime
    build:
      context: ../../coffee_shop_fe
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?Set public Turnstile sitekey}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set public domain}
    ports: ['80:8080', '443:8443']
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    stop_grace_period: 20s
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: { condition: service_healthy }

  tooling:
    profiles: [maintenance]
    build:
      context: ..
      target: tooling
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Use postgres as database hostname}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
