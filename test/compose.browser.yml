name: coffee-shop-browser-test

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: coffee_browser_test
      POSTGRES_PASSWORD: coffee_browser_test
      POSTGRES_DB: coffee_shop_browser_test
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: [CMD-SHELL, pg_isready -U coffee_browser_test -d coffee_shop_browser_test]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 20
